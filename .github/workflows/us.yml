name: us
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: us-runner-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Runner (région US)
        env:
          OC_REGION: us
          OC_AUTH: oidc
          OC_BASE_URL: https://opencookies.com
          FC_REGION: us
          FC_AUTH: oidc
          FC_BASE_URL: https://f-cookies.org
        run: timeout 1800 node runner.mjs || true

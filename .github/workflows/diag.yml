{"name":"Network diagnostic (temporary)","on":"workflow_dispatch","permissions":{"contents":"read"},"jobs":{"diag":{"runs-on":"ubuntu-latest","timeout-minutes":5,"steps":[{"name":"Reach the sites","run":"echo \"runner public IP: $(curl -s -m 10 https://api.ipify.org)\"\nfor u in https://example.com/ https://f-cookies.org/ https://opencookies.com/ https://f-cookies.org/ingest.php; do\necho \"== $u\"\nfor ua in curl/8 node Mozilla/5.0; do\ncurl -sS -o /dev/null -m 20 -A \"$ua\" -w \"  UA=$ua code=%{http_code} ip=%{remote_ip} tls=%{time_appconnect}s\n\" \"$u\" 2>&1 || echo \"  UA=$ua curl exit $?\"\ndone\ndone\necho \"== raw TLS f-cookies.org\"\necho | timeout 15 openssl s_client -connect f-cookies.org:443 -servername f-cookies.org 2>&1 | head -6\necho \"== raw TLS opencookies.com\"\necho | timeout 15 openssl s_client -connect opencookies.com:443 -servername opencookies.com 2>&1 | head -6"},{"name":"Node fetch like the scanner","run":"node --input-type=module -e 'for (const u of [\"https://f-cookies.org/ingest.php?limit=1\",\"https://f-cookies.org/robots.txt\",\"https://opencookies.com/ingest.php?claim=1\"]) { for (const m of [\"GET\",\"POST\"]) { try { const r = await fetch(u,{method:m,headers:{\"x-fc-key\":\"diag\"},body:m===\"POST\"?\"{}\":undefined,signal:AbortSignal.timeout(20000)}); console.log(m,u,r.status); } catch(e) { console.log(m,u,\"FAIL\",e.message,e.cause&&e.cause.code); } } }'"}]}}}

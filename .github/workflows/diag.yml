{"name":"Network diagnostic (temporary)","on":"workflow_dispatch","permissions":{"contents":"read"},"jobs":{"diag":{"runs-on":"ubuntu-latest","timeout-minutes":5,"steps":[{"name":"Paths","run":"set +e\nt() { m=$1; u=$2; shift 2; c=$(curl -sS --http1.1 -o /dev/null -m 15 -X $m \"$@\" -w \"%{http_code}\" \"$u\" 2>&1); echo \"$m $u $* -> $c\"; }\nfor i in 1 2; do\nt GET \"https://opencookies.com/ingest?claim=1\"\nt POST \"https://opencookies.com/ingest\" -d {}\nt GET \"https://opencookies.com/ingest.php?claim=1\"\nt GET \"https://opencookies.com/methode.php\"\nt GET \"https://opencookies.com/methode\"\ndone\nnode --input-type=module -e 'for (const u of [\"https://opencookies.com/ingest?claim=1\",\"https://opencookies.com/ingest.php?claim=1\"]) { try { const r = await fetch(u,{headers:{\"x-fc-key\":\"diag\"}}); console.log(\"node\",u,r.status); } catch(e) { console.log(\"node\",u,\"FAIL\",e.cause&&e.cause.code); } }'\nexit 0"}]}}}

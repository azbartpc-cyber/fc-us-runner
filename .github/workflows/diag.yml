{"name":"Network diagnostic (temporary)","on":"workflow_dispatch","permissions":{"contents":"read"},"jobs":{"diag":{"runs-on":"ubuntu-latest","timeout-minutes":5,"steps":[{"name":"Paths","run":"t() { m=$1; u=$2; shift 2; c=$(curl -sS --http1.1 -o /dev/null -m 15 -X $m \"$@\" -w \"%{http_code}\" \"$u\" 2>&1); echo \"$m $u $* -> $c\"; }\nfor p in ingest.php \"ingest.php?limit=1\" ingest ingest2.php collect.php foo.php trackers.php scan.php submit.php raw.php robots.txt; do t GET \"https://f-cookies.org/$p\"; done\nfor p in foo.php scan.php submit.php ingest.php; do t POST \"https://f-cookies.org/$p\" -d {}; done\nt GET https://f-cookies.org/ingest.php -H \"x-fc-key: a\"\nt GET https://f-cookies.org/ingest.php -A Mozilla/5.0\nt GET \"https://f-cookies.org/foo.php?limit=1\"\nt GET \"https://f-cookies.org/trackers.php?limit=1\"\nt GET \"https://opencookies.com/ingest.php?claim=1\"\nt GET \"https://opencookies.com/seen.php\"\nt GET \"https://opencookies.com/nope.php\"\nt POST \"https://opencookies.com/seen.php\" -d {}"}]}}}

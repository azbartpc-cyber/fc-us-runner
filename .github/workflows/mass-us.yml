name: mass-us
# Étude F-Cookies : plusieurs voies US en parallèle pour la liste de masse (le runner « us » reste inchangé).
# Pour arrêter : désactiver ce workflow (Actions > mass-us > ··· > Disable) ou supprimer ce fichier.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4, 5, 6, 7, 8]
    concurrency:
      group: mass-us-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Runner (région US, voie ${{ matrix.lane }})
        env:
          OC_REGION: us
          OC_AUTH: oidc
          OC_BASE_URL: https://opencookies.com
          FC_REGION: us
          FC_AUTH: oidc
          FC_BASE_URL: https://f-cookies.org
        run: timeout 20400 node runner.mjs || true
